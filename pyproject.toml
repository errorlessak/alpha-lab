[project]
name = "alpha-lab"
version = "0.1.0"
description = "Research platform for calibrating trust in a claimed short-horizon trading edge."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alphacore",
    "alphaservice",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
alphacore = { workspace = true }
alphaservice = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.9.1",
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6.9",
    "schemathesis>=3.38",
    "types-pyyaml>=6.0.12",
]

# --------------------------------------------------------------------------
# Ruff — the only formatter and the only linter (ADR 0004).
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/alphacore/src", "packages/alphaservice/src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ANN",  # missing type annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PL",   # pylint
    "PTH",  # use pathlib
    "RET",  # return simplification
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "T20",  # ban print() — see §18 of ARCHITECTURE.md
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Several functions here take many *keyword-only* parameters because each one
# is a distinct provenance or configuration field — a run manifest, an
# ingestion call, a quality assessment. Bundling them into an options object
# would hide exactly the fields a reviewer needs to see at the call site.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "PLR2004", "ARG", "N803"]
# sklearn's interface is `fit(self, X, y)`. Renaming the parameter would break
# every keyword call into a Pipeline and read as a different API to anyone who
# has used scikit-learn, so the convention wins over the naming rule here.
"packages/alphacore/src/alphacore/models/*" = ["N803", "N806"]
# These docstrings transcribe the formulas from §11.2 verbatim — Φ, γ₃, γ₄ and
# a real MINUS SIGN. Substituting ASCII lookalikes would make them harder to
# check against the specification, which is the only reason they are there.
"packages/alphacore/src/alphacore/eval/*" = ["RUF002"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy — strict on both source trees.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
mypy_path = "packages/alphacore/src:packages/alphaservice/src"
explicit_package_bases = true
namespace_packages = true

# Third-party packages that ship no type information. Each is listed
# explicitly rather than relying on a blanket `ignore_missing_imports`, so a
# newly added untyped dependency is a decision rather than an accident.
[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "exchange_calendars.*",
    "pandas.*",
    "pandera.*",
    "catboost.*",
    "lightgbm.*",
    "pyarrow.*",
    "scipy.*",
    "sklearn.*",
    "xgboost.*",
    "yfinance.*",
]
ignore_missing_imports = true

# scikit-learn ships no type information, so its base classes arrive as `Any`.
# Subclassing one is the documented way to write a transformer, and the
# alternative is not writing one.
[[tool.mypy.overrides]]
module = ["alphacore.models.base"]
disallow_subclassing_any = false

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not network'"
markers = [
    "network: hits a live provider; deselected by default (see §6.1)",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "error",
    # Schemathesis' ASGI transport leaves anyio memory streams for the garbage
    # collector, which surfaces during teardown rather than inside the test, so
    # a per-module mark cannot catch it. Narrow enough that it can only come
    # from an in-process ASGI client.
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["alphacore"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------
# import-linter — enforces the one-way dependency direction from §3.
# --------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["alphacore", "alphaservice"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: web -> alphaservice -> alphacore"
type = "layers"
layers = ["alphaservice", "alphacore"]

[[tool.importlinter.contracts]]
name = "alphacore is not web-shaped"
type = "forbidden"
source_modules = ["alphacore"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "typer", "click"]
