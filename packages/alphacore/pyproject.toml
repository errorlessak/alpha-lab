[project]
name = "alphacore"
version = "0.1.0"
description = "Pure research library: data, features, labels, CV, models, backtest, evaluation."
requires-python = ">=3.12,<3.13"
# The licence text lives at the repository root, one level above this
# package's build root, so it is declared as an expression rather than a file:
# hatchling silently ignores a `license-files` entry it cannot reach, and
# metadata that quietly does nothing is worse than metadata that is absent.
license = "MIT"
authors = [{ name = "Akshy Karthick" }]
dependencies = [
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "loguru>=0.7.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
# Sequence models (Phase 13). `import alphacore` must work without this.
dl = ["torch>=2.4"]
gbm = [
    "catboost>=1.2",
    "lightgbm>=4.5",
    "xgboost>=2.1",
]
# Hyperparameter search (§10.4). Optuna drags in SQLAlchemy, alembic and Mako,
# none of which a run without tuning ever touches, so it stays behind an extra
# and is imported lazily (ADR 0010).
tune = ["optuna>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphacore"]
