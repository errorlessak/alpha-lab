[project]
name = "alphaservice"
version = "0.1.0"
description = "FastAPI service and Typer CLI over the immutable alphacore artifact store."
requires-python = ">=3.12,<3.13"
# See the note in `packages/alphacore/pyproject.toml`: the licence file is
# above this package's build root, so it is declared as an SPDX expression.
license = "MIT"
authors = [{ name = "Akshy Karthick" }]
dependencies = [
    "alphacore",
    "fastapi>=0.162.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
alpha = "alphaservice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaservice"]

[tool.uv.sources]
alphacore = { workspace = true }
